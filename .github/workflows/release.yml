name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: OAuth credentials (desde secrets)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::error::Configurá GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET en los secrets del repo."
            exit 1
          fi
          cat > src-tauri/src/auth/credentials.rs <<EOF
          pub const GOOGLE_CLIENT_ID: &str = "${GOOGLE_CLIENT_ID}";
          pub const GOOGLE_CLIENT_SECRET: &str = "${GOOGLE_CLIENT_SECRET}";
          EOF

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: OrgaLife v__VERSION__
          releaseBody: |
            Instalador DMG y paquete de actualización automática.

            - **DMG**: instalación manual (primera vez o si preferís reinstalar).
            - **Actualización in-app**: la app instalada detecta esta versión y ofrece «Actualizar» en el subheader.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
